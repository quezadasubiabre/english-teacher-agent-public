
<style>
  .root { font-family: var(--font-sans); padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
  .top-bar { display: flex; align-items: center; justify-content: space-between; }
  .pill { display: flex; align-items: center; gap: 8px; background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--color-text-primary); cursor: pointer; }
  .level-pill { background: var(--color-background-secondary); border: 0.5px solid var(--color-border-tertiary); border-radius: 99px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--color-text-primary); }

  .teacher-row { display: flex; align-items: center; gap: 14px; background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 14px 18px; }
  .avatar { width: 42px; height: 42px; border-radius: 50%; background: #E6F1FB; display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 14px; color: #0C447C; flex-shrink: 0; position: relative; }
  .avatar-ring { position: absolute; inset: -3px; border-radius: 50%; border: 2px solid #378ADD; opacity: 0; transition: opacity 0.2s; }
  .avatar-ring.speaking { opacity: 1; animation: ring-pulse 1.2s ease-in-out infinite; }
  @keyframes ring-pulse { 0%,100%{opacity:0.4} 50%{opacity:1} }
  .teacher-info { flex: 1; }
  .teacher-name { font-size: 14px; font-weight: 500; color: var(--color-text-primary); margin: 0 0 2px; }
  .teacher-status { font-size: 12px; color: var(--color-text-secondary); margin: 0; }
  .waveform-teacher { display: flex; align-items: center; gap: 2.5px; height: 32px; }
  .tw-bar { width: 3px; border-radius: 2px; background: #378ADD; transform: scaleY(0.2); }
  .tw-bar.active { animation: tw-wave 0.8s ease-in-out infinite; }
  @keyframes tw-wave { 0%,100%{transform:scaleY(0.2)} 50%{transform:scaleY(1)} }

  .transcript-card { background: var(--color-background-primary); border: 0.5px solid var(--color-border-tertiary); border-radius: var(--border-radius-lg); padding: 1.5rem; min-height: 120px; }
  .live-badge { display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: var(--color-text-secondary); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 1rem; }
  .live-dot { width: 7px; height: 7px; border-radius: 50%; background: #E24B4A; animation: blink-dot 1.4s ease-in-out infinite; }
  @keyframes blink-dot { 0%,100%{opacity:1} 50%{opacity:0.2} }
  .transcript-text { font-size: 19px; font-weight: 400; line-height: 1.65; color: var(--color-text-primary); letter-spacing: -0.01em; min-height: 60px; }
  .cursor { display: inline-block; width: 2px; height: 1.1em; background: var(--color-text-primary); margin-left: 2px; vertical-align: text-bottom; animation: blink-cur 1.1s step-end infinite; }
  @keyframes blink-cur { 0%,100%{opacity:1} 50%{opacity:0} }

  .bottom { display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .user-audio-row { display: flex; align-items: center; gap: 10px; opacity: 0; transition: opacity 0.3s; min-height: 36px; }
  .user-audio-row.active { opacity: 1; }
  .mic-inline { width: 32px; height: 32px; border-radius: 50%; border: 0.5px solid var(--color-border-secondary); background: var(--color-background-primary); display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: background 0.2s, transform 0.15s; flex-shrink: 0; }
  .mic-inline:hover { background: var(--color-background-secondary); }
  .mic-inline:active { transform: scale(0.93); }
  .mic-inline.muted { background: #FCEBEB; border-color: #F09595; }
  .mic-inline i { font-size: 15px; color: var(--color-text-secondary); }
  .mic-inline.muted i { color: #A32D2D; }

  .waveform-user { display: flex; align-items: center; gap: 3px; height: 32px; }
  .uw-bar { width: 3px; border-radius: 2px; background: #1D9E75; animation: uw-wave 0.9s ease-in-out infinite; }
  @keyframes uw-wave { 0%,100%{transform:scaleY(0.3)} 50%{transform:scaleY(1)} }
  .muted-line { width: 100%; height: 2px; background: var(--color-border-tertiary); border-radius: 1px; display: none; }

  .call-area { display: flex; flex-direction: column; align-items: center; gap: 6px; }
  .call-btn { width: 64px; height: 64px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; outline: none; transition: transform 0.15s, background 0.2s; background: #3B6D11; }
  .call-btn:hover { transform: scale(1.06); background: #27500A; }
  .call-btn:active { transform: scale(0.95); }
  .call-btn.connecting { background: #BA7517; animation: connecting-pulse 1.2s ease-in-out infinite; }
  .call-btn.connected { background: #A32D2D; }
  .call-btn.connected:hover { background: #791F1F; }
  .call-btn i { font-size: 26px; color: #EAF3DE; }
  .call-btn.connecting i { color: #FAEEDA; }
  .call-btn.connected i { color: #FCEBEB; }
  @keyframes connecting-pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
  .call-label { font-size: 12px; color: var(--color-text-tertiary); letter-spacing: 0.04em; }
  .timer { font-size: 12px; font-family: var(--font-mono); color: var(--color-text-tertiary); min-height: 18px; }
</style>

<div class="root">
  <h2 style="position:absolute;left:-9999px">Live English lesson with mic icon inline next to user waveform</h2>

  <div class="top-bar">
    <div class="pill" onclick="cycleTopic()">
      <i class="ti ti-message-2" aria-hidden="true" style="font-size:15px;color:#378ADD"></i>
      <span id="topicLbl">Job interview practice</span>
    </div>
    <div class="level-pill">B2 · Intermediate</div>
  </div>

  <div class="teacher-row">
    <div class="avatar">
      <div class="avatar-ring" id="avatarRing"></div>
      ES
    </div>
    <div class="teacher-info">
      <p class="teacher-name">Emma Sullivan</p>
      <p class="teacher-status" id="teacherStatus">Not connected</p>
    </div>
    <div class="waveform-teacher" id="teacherWave"></div>
  </div>

  <div class="transcript-card">
    <div class="live-badge">
      <span class="live-dot"></span>
      live transcription · you
    </div>
    <div class="transcript-text">
      <span id="words"></span><span class="cursor" id="cur" style="display:none"></span>
    </div>
  </div>

  <div class="bottom">
    <div class="user-audio-row" id="userAudioRow">
      <button class="mic-inline" id="micBtn" onclick="toggleMic()" aria-label="Mute microphone">
        <i class="ti ti-microphone" id="micIcon"></i>
      </button>
      <div class="waveform-user" id="userWave"></div>
    </div>

    <div class="call-area">
      <button class="call-btn" id="callBtn" onclick="handleCall()" aria-label="Connect to session">
        <i class="ti ti-phone" id="callIcon"></i>
      </button>
      <span class="call-label" id="callLabel">Connect</span>
      <span class="timer" id="timer"></span>
    </div>
  </div>
</div>

<script>
const topics = ['Job interview practice','Daily conversation','Business meeting','Travel & directions','Academic discussion','Small talk'];
let topicIdx = 0;
function cycleTopic() {
  topicIdx = (topicIdx + 1) % topics.length;
  document.getElementById('topicLbl').textContent = topics[topicIdx];
}

function buildBars(container, count, cssClass) {
  container.innerHTML = '';
  const heights = [10,16,26,20,34,22,14,28,18,24,32,16,26,12,30,20,16,24,28,14,22,34,18,26];
  for (let i = 0; i < count; i++) {
    const b = document.createElement('div');
    b.className = cssClass;
    b.style.height = (heights[i % heights.length]) + 'px';
    b.style.animationDelay = (i * 0.045) + 's';
    container.appendChild(b);
  }
}
buildBars(document.getElementById('teacherWave'), 22, 'tw-bar');
buildBars(document.getElementById('userWave'), 22, 'uw-bar');

const userSentences = [
  "I have been working in marketing for five years, and I think that my experience has prepared me well for this role.",
  "My greatest strength is probably my ability to adapt quickly to new environments.",
  "In my previous position I managed a team of eight people and we launched three major campaigns.",
];
const teacherPhrases = [
  "Very good! But watch your article — it should be 'in marketing', not 'in a marketing'. Let's try again.",
  "Nice! Your pronunciation was clear. Now, can you expand on that?",
  "Excellent sentence structure! Past simple is perfect here. Well done.",
];

let connected = false, muted = false;
let typeTimer = null, teacherTimer = null, elapsedTimer = null;
let charIdx = 0, sentenceIdx = 0, elapsed = 0;

function handleCall() {
  if (connected) { hangUp(); return; }
  const btn = document.getElementById('callBtn');
  const icon = document.getElementById('callIcon');
  btn.classList.add('connecting');
  btn.disabled = true;
  icon.className = 'ti ti-loader-2';
  icon.style.animation = 'spin 1s linear infinite';
  document.getElementById('callLabel').textContent = 'Connecting...';
  document.getElementById('teacherStatus').textContent = 'Connecting to Pipecat...';
  setTimeout(() => {
    btn.disabled = false;
    btn.classList.remove('connecting');
    btn.classList.add('connected');
    icon.className = 'ti ti-phone-off';
    icon.style.animation = '';
    document.getElementById('callLabel').textContent = 'Hang up';
    connected = true;
    document.getElementById('teacherStatus').textContent = 'Listening to you...';
    document.getElementById('userAudioRow').classList.add('active');
    startSession();
  }, 1800);
}

function hangUp() {
  connected = false;
  clearTimeout(typeTimer); clearTimeout(teacherTimer); clearInterval(elapsedTimer);
  document.getElementById('callBtn').classList.remove('connected');
  document.getElementById('callIcon').className = 'ti ti-phone';
  document.getElementById('callIcon').style.animation = '';
  document.getElementById('callLabel').textContent = 'Connect';
  document.getElementById('timer').textContent = '';
  document.getElementById('teacherStatus').textContent = 'Not connected';
  document.getElementById('userAudioRow').classList.remove('active');
  document.getElementById('micBtn').classList.remove('muted');
  document.getElementById('micIcon').className = 'ti ti-microphone';
  document.getElementById('avatarRing').classList.remove('speaking');
  document.getElementById('teacherWave').querySelectorAll('.tw-bar').forEach(b => b.classList.remove('active'));
  document.getElementById('cur').style.display = 'none';
  muted = false;
}

function startSession() {
  document.getElementById('cur').style.display = 'inline-block';
  elapsed = 0;
  elapsedTimer = setInterval(() => {
    elapsed++;
    const m = String(Math.floor(elapsed/60)).padStart(2,'0');
    const s = String(elapsed%60).padStart(2,'0');
    document.getElementById('timer').textContent = m + ':' + s;
  }, 1000);
  typeUser();
}

function toggleMic() {
  if (!connected) return;
  muted = !muted;
  const btn = document.getElementById('micBtn');
  const icon = document.getElementById('micIcon');
  if (muted) {
    btn.classList.add('muted');
    icon.className = 'ti ti-microphone-off';
    document.getElementById('teacherStatus').textContent = 'Muted';
  } else {
    btn.classList.remove('muted');
    icon.className = 'ti ti-microphone';
    document.getElementById('teacherStatus').textContent = 'Listening to you...';
  }
}

function typeUser() {
  if (!connected) return;
  const sentence = userSentences[sentenceIdx % userSentences.length];
  const wordsEl = document.getElementById('words');
  if (charIdx === 0 && sentenceIdx > 0) wordsEl.appendChild(document.createTextNode(' '));
  if (charIdx < sentence.length) {
    wordsEl.appendChild(document.createTextNode(sentence[charIdx]));
    charIdx++;
    typeTimer = setTimeout(typeUser, sentence[charIdx-1] === ' ' ? 55 : Math.random()*50+28);
  } else {
    sentenceIdx++; charIdx = 0;
    typeTimer = setTimeout(() => { if (connected) startTeacher(); }, 800);
  }
}

function startTeacher() {
  document.getElementById('teacherStatus').textContent = 'Speaking...';
  document.getElementById('avatarRing').classList.add('speaking');
  document.getElementById('teacherWave').querySelectorAll('.tw-bar').forEach(b => b.classList.add('active'));
  const dur = teacherPhrases[(sentenceIdx-1) % teacherPhrases.length].length * 38 + 1200;
  teacherTimer = setTimeout(() => {
    document.getElementById('teacherStatus').textContent = 'Listening to you...';
    document.getElementById('avatarRing').classList.remove('speaking');
    document.getElementById('teacherWave').querySelectorAll('.tw-bar').forEach(b => b.classList.remove('active'));
    if (connected && !muted) typeUser();
  }, dur);
}
</script>
<style>@keyframes spin { to { transform: rotate(360deg); } }</style>
